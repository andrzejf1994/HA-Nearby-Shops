name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python scripts/validate_metadata.py --tag "${GITHUB_REF_NAME}"
      - run: gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "Nearby Shops $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
